<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hanz Cagungao Personal Profile</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #f5f7fb;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
      z-index: 1000;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #2563eb;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      transition: 0.3s;
    }

    nav a:hover {
      color: #2563eb;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 20px 60px;
      background: linear-gradient(135deg, #eff6ff, #ffffff);
    }

    .hero-content {
      max-width: 800px;
    }

    .profile-image {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid white;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: 52px;
      margin-bottom: 10px;
      color: #111827;
    }

    .hero h2 {
      font-size: 24px;
      color: #2563eb;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 13px 28px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      transition: 0.3s;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    section {
      padding: 90px 8%;
    }

    .section-title {
      text-align: center;
      font-size: 36px;
      margin-bottom: 45px;
      color: #111827;
    }

    .about {
      max-width: 850px;
      margin: auto;
      text-align: center;
      font-size: 18px;
      color: #555;
    }

    .skills {
      background: white;
    }

    .skill-container {
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .skill {
      background: #f8fafc;
      padding: 25px;
      text-align: center;
      border-radius: 15px;
      transition: 0.3s;
    }

    .skill:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .skill h3 {
      color: #2563eb;
      margin-bottom: 8px;
    }

    .projects {
      background: #f5f7fb;
    }

    .project-container {
      max-width: 1000px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .project-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
      transition: 0.3s;
    }

    .project-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
    }

    .project-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .project-card h3 {
      color: #2563eb;
      margin-bottom: 12px;
      font-size: 22px;
    }

    .project-card p {
      color: #666;
      margin-bottom: 20px;
    }

    .project-btn {
      display: inline-block;
      padding: 9px 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 20px;
      transition: 0.3s;
    }

    .project-btn:hover {
      background: #1d4ed8;
    }

    .contact {
      background: #111827;
      color: white;
      text-align: center;
    }

    .contact .section-title {
      color: white;
    }

    .contact p {
      margin-bottom: 20px;
      color: #d1d5db;
    }

    .social-links {
      margin-top: 25px;
    }

    .social-links a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
      transition: 0.3s;
    }

    .social-links a:hover {
      color: #60a5fa;
    }

    footer {
      background: #0b1120;
      color: #9ca3af;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      nav {
        padding: 15px 5%;
      }

      .logo {
        font-size: 18px;
      }

      nav ul {
        gap: 12px;
        font-size: 13px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .hero h2 {
        font-size: 20px;
      }

      section {
        padding: 70px 6%;
      }
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    function Portfolio() {

      const [message, setMessage] = React.useState("");

      function showMessage() {
        setMessage("Thank you for visiting my portfolio! 🚀");
      }

      return (
        <>

          <nav>
            <div className="logo">
              Hanz Cagungao
            </div>

            <ul>
              <li><a href="#home">Home</a></li>
              <li><a href="#about">About</a></li>
              <li><a href="#skills">Skills</a></li>
              <li><a href="#projects">Projects</a></li>
              <li><a href="#contact">Contact</a></li>
            </ul>
          </nav>

          <section className="hero" id="home">

            <div className="hero-content">

              <img
                src="hanz.jpg.webp"
                alt="Hanz Christian Cagungao"
                className="profile-image"
              />

              <h1>Hi, I'm Hanz!</h1>

              <h2>A Student With a Big Dream</h2>

              <p>
                Welcome to my personal website. I'm passionate about
                technology, constantly learning new things, and creating
                meaningful work that makes a difference.
              </p>

              <a href="#about" className="btn">
                Discover More
              </a>

            </div>

          </section>

          <section id="about">

            <h2 className="section-title">
              About Me
            </h2>

            <div className="about">

              <p>
                Hello! I'm <strong>Hanz Christian C. Cagungao</strong>,
                a 20-year-old Bachelor of Science in Information Technology
                student with a passion for technology, creativity, and
                continuous learning.
              </p>

              <br />

              <p>
                I enjoy learning, solving problems, meeting new people,
                and turning ideas into meaningful results. I believe that
                every challenge is an opportunity to learn and improve.
              </p>

              <br />

              <p>
                Although I am still building my experience, I am always
                willing to learn, adapt, and take on new challenges.
              </p>

              <br />

              <p>
                My goal is to become a skilled IT professional who can
                use technology to create useful solutions and make a
                positive impact.
              </p>

            </div>

          </section>

          <section className="skills" id="skills">

            <h2 className="section-title">
              My Skills
            </h2>

            <div className="skill-container">

              <div className="skill">
                <h3>Technology</h3>
                <p>
                  Web development, programming and digital tools.
                </p>
              </div>

              <div className="skill">
                <h3>Creativity</h3>
                <p>
                  Creative thinking, design and problem solving.
                </p>
              </div>

              <div className="skill">
                <h3>Communication</h3>
                <p>
                  Clear communication and teamwork.
                </p>
              </div>

              <div className="skill">
                <h3>Sports</h3>
                <p>
                  Swimming, basketball, badminton and cycling.
                </p>
              </div>

            </div>

          </section>

          <section className="projects" id="projects">

            <h2 className="section-title">
              My Projects
            </h2>

            <div className="project-container">

              <div className="project-card">

                

                <h3>
                  Personal Portfolio Website
                </h3>

                <p>
                  A personal portfolio website created to introduce
                  myself and showcase my skills, interests, and journey
                  as an Information Technology student.
                </p>

               

              </div>

              <div className="project-card">

               

                <h3>
                  Web Development Project
                </h3>

                <p>
                  A simple web development project created while
                  learning HTML, CSS, JavaScript, and web development
                  fundamentals.
                </p>

                

              </div>

              <div className="project-card">

                

                <h3>
                  NVSU Website
                </h3>

                <p>
                  A simple NVSU website featuring a login form and
                  registration form. This project helped me practice
                  HTML, CSS, JavaScript, and web application development.
                </p>

                

              </div>

              <div className="project-card">

               

                <h3>
                  Future Project
                </h3>

                <p>
                  Future projects where I can apply my growing
                  programming knowledge and create useful and
                  innovative solutions.
                </p>

                <a href="#projects" className="project-btn">
                  Coming Soon
                </a>

              </div>

            </div>

          </section>

          <section className="contact" id="contact">

            <h2 className="section-title">
              Let's Connect
            </h2>

            <p>
              I'd love to connect, collaborate, or simply have
              a conversation.
            </p>

            <button
              className="btn"
              onClick={showMessage}
            >
              Say Hello!!!
            </button>

            {message && (
              <p
                style={{
                  marginTop: "20px",
                  color: "#60a5fa"
                }}
              >
                {message}
              </p>
            )}

            <div className="social-links">

              <a
                href="https://www.facebook.com/share/1FCMapfq5F/"
                target="_blank"
                rel="noopener noreferrer"
              >
                Facebook
              </a>

              <a
                href="https://www.instagram.com/this_is_hanzzzzz"
                target="_blank"
                rel="noopener noreferrer"
              >
                Instagram
              </a>

            </div>

          </section>

          <footer>
            <p>
              © 2026 Hanz "POGI" Cagungao.
              All rights reserved.
            </p>
          </footer>

        </>
      );
    }

    const root = ReactDOM.createRoot(
      document.getElementById("root")
    );

    root.render(
      <Portfolio />
    );

  </script>

</body>
</html>
